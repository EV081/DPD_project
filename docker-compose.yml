# UrbanSafe · stack de la aplicacion (Elmer Villegas)
#
#   docker compose up --build            # db (solo usuarios) + backend (:5000) + frontend (:3000)
#   docker compose down                  # detiene (el volumen pgdata persiste)
#   docker compose down -v               # detiene y borra la base
#
# El pipeline de ingesta de week10 ya no forma parte del arranque: el backend no lee datos de
# Postgres (modelos y datos viajan en backend/models y backend/data). Sigue disponible a demanda:
#   docker compose --profile pipeline run --rm pipeline full|live|loop|pytest
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${PGUSER:-urbansafe}
      POSTGRES_PASSWORD: ${PGPASSWORD:-urbansafe_dev}
      POSTGRES_DB: ${PGDATABASE:-urbansafe}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Base SOLO para las pruebas del backend (backend/tests): distinta de `db`, vive en memoria (tmpfs) y se
  # borra al apagarla, así las pruebas nunca tocan los datos de desarrollo:
  #   docker compose --profile test up -d db-test   &&   cd backend && pytest
  db-test:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: urbansafe_test
    ports:
      - "${PGTESTPORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urbansafe_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  # API Flask: los usuarios van a Postgres (tabla users, create_all al arrancar)
  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${PGUSER:-urbansafe}:${PGPASSWORD:-urbansafe_dev}@db:5432/${PGDATABASE:-urbansafe}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_secret_key}
      LOCATIONIQ_TOKEN: ${LOCATIONIQ_TOKEN:-}
      API_TOMTOM: ${API_TOMTOM:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrador}
      SEED_ADMIN_ON_START: ${SEED_ADMIN_ON_START:-1}
      PORT: "5000"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      EJE2_PRECALENTAR: ${EJE2_PRECALENTAR:-1}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Jobs del backend (Eje 1 y Eje 2). En producción se programan como Cron Jobs; aquí, a demanda:
  #   docker compose --profile backend-pipeline run --rm backend-pipeline pipeline-diario
  #   docker compose --profile backend-pipeline run --rm backend-pipeline pipeline-semanal
  #   (también: db-particiones, eje2-recalibrar, monitoreo-semanal, calibrar-eta, monitoreo-resumen)
  backend-pipeline:
    profiles: ["backend-pipeline"]
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${PGUSER:-urbansafe}:${PGPASSWORD:-urbansafe_dev}@db:5432/${PGDATABASE:-urbansafe}
      EJE2_PRECALENTAR: "0"
    entrypoint: ["flask", "--app", "app"]
    command: ["pipeline-diario"]

  # Next.js: el navegador llama a la API por el puerto publicado del backend
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3002}:3000"

  pipeline:
    profiles: ["pipeline"]   # no arranca con `up`; ver cabecera
    build: ./deliveries/week10
    depends_on:
      db:
        condition: service_healthy
    # corre como el usuario del host para no dejar export/ con dueño root
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${PGUSER:-urbansafe}
      PGPASSWORD: ${PGPASSWORD:-urbansafe_dev}
      PGDATABASE: ${PGDATABASE:-urbansafe}
      API_TOMTOM: ${API_TOMTOM:-}
      TOMMTOM_KEY: ${TOMMTOM_KEY:-}
      DATA_DIR: /data/processed
      EXPORT_DIR: /app/out
      MODELO_OUTPUTS_DIR: /app/model_outputs
      GEO_DIR: /data/geo
    volumes:
      # entradas versionadas en el repo (week10/data_processed): un clon basta para levantar todo
      - ./deliveries/week10/data_processed:/data/processed:ro
      - ./deliveries/week10/data_processed/geo:/data/geo:ro
      - ./deliveries/week10/export:/app/out:rw
      - ./deliveries/week10/code/model/outputs:/app/model_outputs:ro
    command: ["full"]

volumes:
  pgdata:
